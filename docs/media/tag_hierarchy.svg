<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" width="620" height="300"
     role="img" aria-labelledby="t d">
  <title id="t">One volume, four regions</title>
  <desc id="d">Four nested boxes labelled Castle, Castle.Keep, Castle.Keep.Hall and
    Castle.Keep.Hall.Vault, each inside the one before it and each drawn brighter than the one
    outside it. A single actor marker sits in the innermost box, and a note reads: one volume
    placed, four regions entered.</desc>

  <!--
    PALETTE: Vestro "Carbon" (p24), the site's live palette. Lime #B6FF00 on true black.
    NOT the ember orange this file used to carry: that came from src/tokens/colors.css, and v2.js
    applies the palette at runtime and overwrites those values on every page load, so the token file
    has not been the site's colour for a long time.

    THE PANEL IS DELIBERATE. An SVG loaded through <img> cannot read the page's CSS variables, so it
    cannot follow the docs' light/dark toggle. Lime is illegible on white and the light-mode olive is
    illegible on black, so no single set of strokes works on both page backgrounds. Carrying its own
    background solves that outright, and it sits consistently beside the editor captures on the same
    pages, which are dark for the same reason.

    The depth ramp is not decoration: it is the depth colouring the plugin applies to a region
    volume's ShapeColor, so a reader who has seen the viewport recognises the diagram.
  -->
  <rect x="0" y="0" width="620" height="300" fill="#121417"/>
  <rect x="0.5" y="0.5" width="619" height="299" fill="none" stroke="#2A3038"/>

  <g fill="none" stroke-width="2">
    <rect x="14"  y="14"  width="420" height="240" stroke="#5C7A1F"/>
    <rect x="46"  y="46"  width="356" height="176" stroke="#7FA82B"/>
    <rect x="78"  y="78"  width="292" height="112" stroke="#9BD436"/>
    <rect x="110" y="110" width="228" height="48"  stroke="#B6FF00" stroke-width="2.5"/>
  </g>

  <g font-family="Inter, system-ui, sans-serif" font-size="13">
    <text x="26"  y="34"  fill="#5C7A1F">Castle</text>
    <text x="58"  y="66"  fill="#7FA82B">Castle.Keep</text>
    <text x="90"  y="98"  fill="#9BD436">Castle.Keep.Hall</text>
    <text x="122" y="130" fill="#B6FF00">Castle.Keep.Hall.Vault</text>
  </g>

  <circle cx="310" cy="134" r="7" fill="#B6FF00"/>
  <line x1="317" y1="134" x2="470" y2="134" stroke="#B6FF00" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g font-family="Inter, system-ui, sans-serif" fill="#899099">
    <text x="478" y="123" font-size="13" font-weight="600" fill="#B6FF00">One volume placed.</text>
    <text x="478" y="143" font-size="13" fill="#F4F6F7">Four regions entered.</text>
    <text x="478" y="171" font-size="11.5">Nothing was told that a</text>
    <text x="478" y="187" font-size="11.5">vault sits inside a hall.</text>
    <text x="478" y="203" font-size="11.5">The tag said so.</text>
  </g>
</svg>
